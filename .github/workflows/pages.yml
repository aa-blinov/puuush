name: GitHub Pages

# Сайт лежит в site/ и публикуется из того же репозитория: источник и
# опубликованная страница рядом, и версия сайта видна в истории рядом с
# версией приложения.
on:
  push:
    branches:
      - main
    paths:
      - site/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # enablement: репозиторий ещё не был сайтом на Pages, и без этого
      # шага workflow падал бы на «Get Pages site failed».
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
