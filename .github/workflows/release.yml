name: release

# Tag-triggered release. A tag of v* produces a release with the artefacts
# the project ships, and the changelog section for that version becomes the
# release body.
#
# Три платформы собираются нативно на своих раннерах: electron-builder не
# умеет кросс-сборку, .dmg собирается только на macOS, а .exe — только на
# Windows. Релиз собирается из того, что собрали эти job'ы: файлы складываются
# в выдачу джобы и скачиваются в джобе релиза.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to release, for example v1.1.0. Leave empty to build without publishing.
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Проверка версии
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Сверка тега с версией в package.json
        id: version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          TAG="${TAG#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::тег $TAG и версия в package.json $PKG разошлись"
            exit 1
          fi
          echo "version=$PKG" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Выпускаем $PKG"

  build:
    name: Сборка ${{ matrix.name }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
            script: dist:linux
            artifact: puuush-linux
            paths: |
              dist/*.AppImage
              dist/*.deb
          - name: windows
            os: windows-latest
            script: dist:win
            artifact: puuush-windows
            paths: |
              dist/*.exe
          - name: macos-arm64
            os: macos-15
            script: dist:mac:arm64
            artifact: puuush-macos-arm64
            paths: |
              dist/*.dmg
          - name: macos-x64
            os: macos-15-intel
            script: dist:mac:x64
            artifact: puuush-macos-x64
            paths: |
              dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.verify.outputs.version }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Окна интерфейса собираются из renderer/ в src/renderer/: без этого
      # шага в пакете не будет ни настроек, ни выбора области.
      - run: npm run build:renderer
      - name: Сборка
        if: matrix.name == 'linux' || matrix.name == 'windows'
        run: npm run ${{ matrix.script }}
      - name: Сборка (macOS)
        if: matrix.name != 'linux' && matrix.name != 'windows'
        env:
          # Сертификат Developer ID и учётная запись для нотификации. Пока
          # секретов нет, сборка идёт с подписью ad-hoc: приложение запускается,
          # но macOS спрашивает подтверждение при первом открытии. Секреты
          # появятся — и вопросов больше не будет.
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run ${{ matrix.script }}
      # Сборка macOS проверяет образ сама: если он битый, джоба падает и
      # релиз не выходит, вместо того чтобы ломаться у человека.
      - name: Проверка образа
        if: matrix.name != 'linux' && matrix.name != 'windows'
        run: node scripts/check-dmg.cjs dist
      - name: Проверка подписи приложения
        if: matrix.name != 'linux' && matrix.name != 'windows'
        run: |
          # Подпись проверяется настоящим codesign на настоящем Mac: без
          # подписи приложение на Apple silicon не запускается, и macOS
          # называет это «приложение повреждено». Сборка проходит успешно и
          # без подписи, поэтому проверять надо здесь.
          APP="$(find dist -maxdepth 2 -name 'puuush.app' -type d | head -1)"
          if [ -z "$APP" ]; then
            echo "::error::приложение не собрано"
            exit 1
          fi
          # Просто спрашиваем подпись: codesign ругается ненулевым кодом,
          # если бандл не подписан вовсе. Строгая проверка с цепочкой
          # сертификатов тут не годится: подпись ad-hoc цепочки не имеет.
          codesign -dv --verbose=2 "$APP" 2>&1 | head -6
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          # Пустая выдача означает, что сборка не вышла: молчаливый релиз без
          # файла хуже, чем упавший.
          if-no-files-found: error

  release:
    name: Релиз
    needs: [verify, build]
    # Публикуем только по тегу. Ручной запуск без тега собирает пакеты, но
    # релиз не создаёт: тег — это версия, а не кнопка.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.verify.outputs.version }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Заметки релиза
        run: node scripts/release-notes.cjs "${{ needs.verify.outputs.version }}" > release-notes.md

      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.verify.outputs.version }}
          name: puuush v${{ needs.verify.outputs.version }}
          body_path: release-notes.md
          files: |
            release-artifacts/*.exe
            release-artifacts/*.dmg
            release-artifacts/*.AppImage
            release-artifacts/*.deb
          fail_on_unmatched_files: true
