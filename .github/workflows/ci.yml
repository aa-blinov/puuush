name: ci

# Install, test, build. The house-style check is a separate workflow, so
# that a failure of the standard is visibly different from a failure of the
# code.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        # The build of the windows, svelte-check over the components and the
        # Node test runner.
        run: npm run check

      - name: Build
        # The two windows, built from renderer/ into src/renderer/.
        run: npm run build:renderer

      - name: Windows
        # The windows have to work in a real Electron: the region picker has
        # to confirm a frame and cancel, and the settings window has to write
        # what was chosen to disk.
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
        run: xvfb-run -a npm run test:electron
