name: platforms check

# Временная проверка перед релизом: окна и установщик на Windows и macOS.
# Запускается вручную из ветки и удаляется перед слиянием в main.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            dist: dist:win
          - name: macos-arm64
            os: macos-15
            dist: dist:mac:arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Check and test
        run: npm run check

      - name: Build the windows
        run: npm run build:renderer

      - name: Clipboard
        run: npx electron test/electron/clipboard-check.js

      - name: Settings window
        run: npx electron test/electron/settings-window-check.js

      - name: Region picker
        # На macOS без разрешения «Запись экрана» захват пустой: это видно в логе.
        continue-on-error: true
        run: npx electron test/electron/region-check.js

      - name: Thin selection
        continue-on-error: true
        run: npx electron test/electron/thin-selection-check.js

      - name: Package
        run: npm run ${{ matrix.dist }}

      - name: Check the image
        if: matrix.name != 'windows'
        run: node scripts/check-dmg.cjs dist
