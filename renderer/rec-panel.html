<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline';"
    />
    <title>puuush — панель записи</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
      }
      .panel {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 100%;
        box-sizing: border-box;
        padding: 0 10px 0 12px;
        border-radius: 14px;
        background: rgba(22, 22, 24, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #f4f4f5;
        font: 500 13px/1 system-ui, -apple-system, 'Segoe UI', sans-serif;
        -webkit-app-region: drag;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        flex: none;
        background: #e5484d;
        animation: blink 1.1s ease-in-out infinite;
      }
      .time {
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.02em;
        min-width: 44px;
      }
      .spacer {
        flex: 1;
      }
      button {
        -webkit-app-region: no-drag;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 30px;
        height: 30px;
        padding: 0;
        border: 0;
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.08);
        color: #f4f4f5;
        cursor: pointer;
      }
      button:hover {
        background: rgba(255, 255, 255, 0.16);
      }
      button.stop {
        background: rgba(229, 72, 77, 0.9);
      }
      button.stop:hover {
        background: #e5484d;
      }
      svg {
        width: 14px;
        height: 14px;
        display: block;
        fill: currentColor;
      }
      .paused .dot {
        background: #f5a524;
        animation: none;
        opacity: 1;
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.15;
        }
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <span class="dot"></span>
      <span class="time" id="time">00:00</span>
      <span class="spacer"></span>
      <button id="toggle" title="Пауза">
        <svg id="toggle-icon" viewBox="0 0 16 16" aria-hidden="true">
          <rect x="4" y="3" width="3" height="10" rx="1" />
          <rect x="9" y="3" width="3" height="10" rx="1" />
        </svg>
      </button>
      <button id="stop" class="stop" title="Остановить">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <rect x="4" y="4" width="8" height="8" rx="1.5" />
        </svg>
      </button>
    </div>
    <script type="module" src="./rec-panel.js"></script>
  </body>
</html>
