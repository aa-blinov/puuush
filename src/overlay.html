<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'self';">
<title>puuush</title>
<style>
  /* Окно выбора области: затемнённый снимок экрана, чистая рамка, подписи
     в токенах settings.html. Тема следует за ОС. */
  :root {
    color-scheme: light dark;
    --ring: #2563eb;
    --pill-bg: rgba(255, 255, 255, .94);
    --pill-fg: #09090b;
    --pill-border: #e4e4e7;
    --kbd-bg: #f4f4f5;
    --kbd-border: #8e8e96;
    --size-bg: #09090b;
    --size-fg: #fafafa;
    --danger: #b91c1c;
    --danger-border: #fca5a5;
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ring: #60a5fa;
      --pill-bg: rgba(24, 24, 27, .94);
      --pill-fg: #fafafa;
      --pill-border: #27272a;
      --kbd-bg: #18181b;
      --kbd-border: #71717a;
      --size-bg: #fafafa;
      --size-fg: #09090b;
      --danger: #f87171;
      --danger-border: #7f1d1d;
    }
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    cursor: crosshair;
    user-select: none;
    -webkit-user-select: none;
    font: 13px/1.4 var(--font);
  }
  #shot {
    position: absolute;
    inset: 0;
    display: none;
  }
  #veil {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
  }
  /* Вырез: подсвеченный прямоугольник, остальное затемнено через тень. */
  #cut {
    position: absolute;
    display: none;
    box-sizing: border-box;
    border: 1px solid var(--ring);
    box-shadow: 0 0 0 1px rgba(0, 0, 0, .35), 0 0 0 9999px rgba(0, 0, 0, .45);
  }
  #hint {
    position: absolute;
    left: 50%;
    top: 22px;
    transform: translateX(-50%);
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--pill-border);
    background: var(--pill-bg);
    color: var(--pill-fg);
    box-shadow: 0 1px 2px rgba(0, 0, 0, .08);
    white-space: nowrap;
    pointer-events: none;
  }
  kbd {
    font: 600 11px/1 var(--mono);
    padding: 3px 6px;
    margin: 0 1px;
    border-radius: 4px;
    border: 1px solid var(--kbd-border);
    background: var(--kbd-bg);
    color: var(--pill-fg);
  }
  /* Подпись размера ровно 20 px в высоту: overlay.js ставит её на box.y - 22. */
  #size {
    position: absolute;
    display: none;
    height: 20px;
    padding: 0 7px;
    border-radius: 4px;
    background: var(--size-bg);
    color: var(--size-fg);
    font: 500 11px/20px var(--mono);
    font-variant-numeric: tabular-nums;
    pointer-events: none;
    white-space: nowrap;
  }
  #err {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    padding: 20px 26px;
    border-radius: 8px;
    border: 1px solid var(--danger-border);
    background: var(--pill-bg);
    color: var(--danger);
    box-shadow: 0 1px 2px rgba(0, 0, 0, .08);
    display: none;
    max-width: 70%;
    text-align: center;
  }
</style>
</head>
<body>
  <div id="err"></div>
  <img id="shot" alt="" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
  <div id="veil"></div>
  <div id="cut"></div>
  <div id="size"></div>
  <div id="hint">
    Тяни рамку — <kbd>Enter</kbd> подтвердить, <kbd>Esc</kbd> отменить,
    <kbd>Space</kbd> — весь экран
  </div>

  <script src="overlay.js"></script>
</body>
</html>
