<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'self'; font-src 'self';">
<title>puuush</title>
<style>
  /* Выбор области в той же линейке, что и настройки и monos: чернила на бумаге,
     JetBrains Mono, одна рамка, без теней. Тёмная тема основная. */
  @font-face {
    font-family: "JetBrains Mono";
    font-style: normal;
    font-weight: 100 800;
    font-display: swap;
    src: url("fonts/jetbrains-mono-latin.woff2") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: "JetBrains Mono";
    font-style: normal;
    font-weight: 100 800;
    font-display: swap;
    src: url("fonts/jetbrains-mono-latin-ext.woff2") format("woff2");
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  @font-face {
    font-family: "JetBrains Mono";
    font-style: normal;
    font-weight: 100 800;
    font-display: swap;
    src: url("fonts/jetbrains-mono-cyrillic.woff2") format("woff2");
    unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
  }
  @font-face {
    font-family: "JetBrains Mono";
    font-style: normal;
    font-weight: 100 800;
    font-display: swap;
    src: url("fonts/jetbrains-mono-cyrillic-ext.woff2") format("woff2");
    unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;
  }

  :root {
    color-scheme: light dark;
    --bg: #282828;
    --fg: #ebdbb2;
    --muted: #a89984;
    --rule: #504945;
    --control: #928374;
    --ring: #ebdbb2;
    --surface: #3c3836;
    --danger: #ff8a7a;
    --pill: rgba(40, 40, 40, .94);
    --size-bg: #ebdbb2;
    --size-fg: #282828;
    --font: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #fbf1c7;
      --fg: #3c3836;
      --muted: #665c54;
      --rule: #d5c4a1;
      --control: #928374;
      --ring: #3c3836;
      --surface: #ebdbb2;
      --danger: #cc241d;
      --pill: rgba(251, 241, 199, .94);
      --size-bg: #3c3836;
      --size-fg: #fbf1c7;
    }
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    cursor: crosshair;
    user-select: none;
    -webkit-user-select: none;
    font: 12px/1.45 var(--font);
  }
  #shot {
    position: absolute;
    inset: 0;
    display: none;
  }
  #veil {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
  }
  /* Вырез: подсвеченный прямоугольник, остальное затемнено тенью. Рамка чернилами темы. */
  #cut {
    position: absolute;
    display: none;
    box-sizing: border-box;
    border: 1px solid var(--ring);
    box-shadow: 0 0 0 1px rgba(0, 0, 0, .35), 0 0 0 9999px rgba(0, 0, 0, .45);
  }
  #hint {
    position: absolute;
    left: 50%;
    top: 22px;
    transform: translateX(-50%);
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid var(--rule);
    background: var(--pill);
    color: var(--fg);
    white-space: nowrap;
    pointer-events: none;
  }
  kbd {
    font: 600 11px/1 var(--font);
    padding: 3px 6px;
    margin: 0 1px;
    border-radius: 6px;
    border: 1px solid var(--control);
    background: var(--surface);
    color: var(--fg);
  }
  /* Подпись размера ровно 20 px в высоту: overlay.js ставит её над рамкой или под ней. */
  #size {
    position: absolute;
    display: none;
    height: 20px;
    padding: 0 7px;
    border-radius: 6px;
    background: var(--size-bg);
    color: var(--size-fg);
    font: 500 11px/20px var(--font);
    font-variant-numeric: tabular-nums;
    pointer-events: none;
    white-space: nowrap;
  }
  #err {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    padding: 20px 26px;
    border-radius: 6px;
    border: 1px solid var(--danger);
    background: var(--pill);
    color: var(--danger);
    display: none;
    max-width: 70%;
    text-align: center;
  }
</style>
</head>
<body>
  <div id="err"></div>
  <img id="shot" alt="" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
  <div id="veil"></div>
  <div id="cut"></div>
  <div id="size"></div>
  <div id="hint">
    Тяни рамку — <kbd>Enter</kbd> подтвердить, <kbd>Esc</kbd> отменить,
    <kbd>Space</kbd> — весь экран
  </div>

  <script src="overlay.js"></script>
</body>
</html>
